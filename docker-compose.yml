# =============================================================================
# Remembr — Docker Compose (local embeddings by default)
# =============================================================================
# First-time setup:  bash scripts/docker-init.sh
# Day-to-day:        docker compose --profile ollama up -d
# Stop:              docker compose --profile ollama down
#
# Embedding providers:
#   ollama (default) — bundled, no API key needed
#   sentence_transformers — local, downloads its model on first use
#   jina / openai — set EMBEDDING_PROVIDER + API key in .env
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL + pgvector — Long-term episodic memory storage
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ${COMPOSE_PROJECT_NAME:-remembr}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: remembr
      POSTGRES_PASSWORD: remembr
      POSTGRES_DB: remembr
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remembr -d remembr"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # PgBouncer — Connection pooler (transaction mode)
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: ${COMPOSE_PROJECT_NAME:-remembr}-pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: remembr
      DB_PASSWORD: remembr
      DB_NAME: remembr
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 20
      MAX_CLIENT_CONN: 200
      AUTH_TYPE: scram-sha-256
      SERVER_TLS_SSLMODE: disable
    ports:
      - "127.0.0.1:${PGBOUNCER_PORT:-6432}:6432"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Redis — Short-term memory cache and rate limiting
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-remembr}-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Ollama — Local embedding inference (no API key required)
  # Enable with --profile ollama. Setup scripts do this for the local default.
  # ---------------------------------------------------------------------------
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: ${COMPOSE_PROJECT_NAME:-remembr}-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Ollama Init — Pulls nomic-embed-text once, then exits.
  # Re-running is safe — ollama pull is idempotent.
  # ---------------------------------------------------------------------------
  ollama-init:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: ${COMPOSE_PROJECT_NAME:-remembr}-ollama-init
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"]
    depends_on:
      ollama:
        condition: service_healthy

  # Complete schema upgrades before any API, worker or scheduler starts.
  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: "no"
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://remembr:remembr@postgres:5432/remembr
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Celery Worker — processes embedding generation tasks from the queue
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-remembr}-worker
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://remembr:remembr@pgbouncer:6432/remembr}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Celery Beat — periodic task scheduler
  # Runs the daily purge_soft_deleted task at 03:00 UTC.
  # ---------------------------------------------------------------------------
  worker-beat:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-remembr}-worker-beat
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://remembr:remembr@pgbouncer:6432/remembr}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Remembr Server — FastAPI application
  # ---------------------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-remembr}-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REMEMBR_PORT:-8000}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://remembr:remembr@pgbouncer:6432/remembr}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
