name: Local-model memory quality

on:
  workflow_dispatch:
    inputs:
      run_answers:
        description: Run the local reader and separate judge after retrieval
        type: boolean
        default: true
      questions_per_conversation:
        description: Seeded questions per conversation for each retrieval arm
        type: choice
        options:
          - '5'
          - '25'
        default: '5'
      compare_readers:
        description: Compare Qwen3 1.7B and 4B Instruct on identical evidence
        type: boolean
        default: false
      audit_public_key:
        description: Optional base64 DER RSA public key for encrypted private review
        type: string
        default: ''
  pull_request:
    paths:
      - .github/workflows/memory-quality.yml

permissions:
  contents: read

concurrency:
  group: memory-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      ollama:
        image: ollama/ollama:0.35.1
        ports:
          - 11434:11434
        options: >-
          --memory=10g --cpus=4
          --health-cmd="ollama list"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      RUN_ROOT: /tmp/remembr-memory-quality
      RUN_ANSWERS: ${{ github.event_name == 'pull_request' || inputs.run_answers }}
      QUESTIONS_PER_CONVERSATION: ${{ inputs.questions_per_conversation || '5' }}
      COMPARE_READERS: ${{ inputs.compare_readers }}
      BENCHMARK_AUDIT_PUBLIC_KEY: ${{ inputs.audit_public_key }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight tokenizer dependency
        run: python -m pip install tiktoken==0.14.0 cryptography==50.0.2
      - name: Verify private audit encryption
        run: python -m unittest discover -s tests -p test_audit_artifact.py
      - name: Run models inside this runner
        shell: bash
        run: |
          args=()
          if [[ "$RUN_ANSWERS" == "true" ]]; then args+=(--answers); fi
          if [[ "$COMPARE_READERS" == "true" ]]; then args+=(--compare-readers); fi
          python -m benchmarks.ci_quality run --work-dir "$RUN_ROOT" --questions-per-conversation "$QUESTIONS_PER_CONVERSATION" "${args[@]}"
      - name: Write aggregate report even after failure
        if: always()
        run: python -m benchmarks.ci_quality report --work-dir "$RUN_ROOT"
      - name: Upload aggregate results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-model-memory-quality
          path: ${{ env.RUN_ROOT }}/public/
          retention-days: 7
          if-no-files-found: warn
      - name: Seal optional reviewer artifact
        if: always() && inputs.audit_public_key != ''
        run: python -m benchmarks.audit_artifact seal --work-dir "$RUN_ROOT/answers" --output "$RUN_ROOT/audit.encrypted.json"
      - name: Upload encrypted reviewer artifact
        if: always() && inputs.audit_public_key != ''
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-model-audit
          path: ${{ env.RUN_ROOT }}/audit.encrypted.json
          retention-days: 3
          if-no-files-found: error
      - name: Stop the owned model container
        if: always()
        run: docker stop "${{ job.services.ollama.id }}"
