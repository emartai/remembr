name: Local-model memory quality

on:
  workflow_dispatch:
    inputs:
      run_answers:
        description: Run the local reader and separate judge after retrieval
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/memory-quality.yml

permissions:
  contents: read

concurrency:
  group: memory-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      ollama:
        image: ollama/ollama:0.35.1
        ports:
          - 11434:11434
        options: >-
          --memory=10g --cpus=4
          --health-cmd="ollama list"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      RUN_ROOT: ${{ runner.temp }}/remembr-memory-quality
      RUN_ANSWERS: ${{ github.event_name == 'pull_request' || inputs.run_answers }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight tokenizer dependency
        run: python -m pip install tiktoken==0.14.0
      - name: Run models inside this runner
        shell: bash
        run: |
          args=()
          if [[ "$RUN_ANSWERS" == "true" ]]; then args+=(--answers); fi
          python -m benchmarks.ci_quality run --work-dir "$RUN_ROOT" "${args[@]}"
      - name: Write aggregate report even after failure
        if: always()
        run: python -m benchmarks.ci_quality report --work-dir "$RUN_ROOT"
      - name: Upload aggregate results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-model-memory-quality
          path: ${{ runner.temp }}/remembr-memory-quality/public/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop the owned model container
        if: always()
        run: docker stop "${{ job.services.ollama.id }}"
