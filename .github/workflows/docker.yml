name: Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_agent_hosts:
        description: Verify OpenClaw and Hermes MCP handoff on the disposable stack
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  COMPOSE_PROJECT_NAME: remembr_ci_default

jobs:
  smoke-test-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the documented default stack
        run: python scripts/local_setup.py --timeout 600

      - name: Verify private memory and tenant isolation
        run: python scripts/smoke_test.py --timeout 180

      - name: Install the published Python SDK
        run: python -m pip install remembr==0.2.1

      - name: Verify the onboarding example and restart persistence
        run: python scripts/verify_shared_quickstart.py --recreate

      - name: Install the published MCP bridge into an isolated environment
        if: inputs.verify_agent_hosts
        run: |
          python -m venv "$RUNNER_TEMP/remembr-mcp"
          "$RUNNER_TEMP/remembr-mcp/bin/python" -m pip install 'remembr[mcp]==0.2.2'

      - uses: actions/setup-node@v4
        if: inputs.verify_agent_hosts
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        if: inputs.verify_agent_hosts
        with:
          python-version: '3.14'

      - name: Install agent hosts on the runner
        if: inputs.verify_agent_hosts
        run: |
          npm install -g openclaw@2026.11.6
          openclaw --version
          python -m pip install uv
          git clone --depth 1 --branch v0.23.3 https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          uv sync --project "$RUNNER_TEMP/hermes-agent" --frozen --extra mcp --python "$(command -v python)"

      - name: Verify OpenClaw to Hermes to OpenClaw
        if: inputs.verify_agent_hosts
        run: |
          "$RUNNER_TEMP/hermes-agent/.venv/bin/python" scripts/verify_mcp_hosts.py --bridge "$RUNNER_TEMP/remembr-mcp/bin/python"

      - name: Record runtime versions and migrations
        run: |
          docker compose --profile ollama images
          docker compose exec -T ollama ollama --version
          docker compose exec -T ollama ollama list
          docker compose exec -T server alembic current
          curl --fail http://localhost:8000/api/v1/ready

      - name: Capture logs on failure
        if: failure()
        run: |
          docker compose --profile ollama ps -a
          docker compose logs --tail 100 migrate server worker ollama

      - name: Tear down
        if: always()
        run: docker compose --profile ollama down --volumes --remove-orphans
