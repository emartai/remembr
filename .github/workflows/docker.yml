name: Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  COMPOSE_PROJECT_NAME: remembr_ci_default

jobs:
  smoke-test-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the documented default stack
        run: python scripts/local_setup.py --timeout 600

      - name: Verify private memory and tenant isolation
        run: python scripts/smoke_test.py --timeout 180

      - name: Install the published Python SDK
        run: python -m pip install remembr==0.2.1

      - name: Verify the onboarding example and restart persistence
        run: python scripts/verify_shared_quickstart.py --recreate

      - name: Record runtime versions and migrations
        run: |
          docker compose --profile ollama images
          docker compose exec -T ollama ollama --version
          docker compose exec -T ollama ollama list
          docker compose exec -T server alembic current
          curl --fail http://localhost:8000/api/v1/ready

      - name: Capture logs on failure
        if: failure()
        run: |
          docker compose --profile ollama ps -a
          docker compose logs --tail 100 migrate server worker ollama

      - name: Tear down
        if: always()
        run: docker compose --profile ollama down --volumes --remove-orphans
